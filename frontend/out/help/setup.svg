" y2="160" stroke="#e3e8ee" stroke-width="1"/><g><circle cx="430" cy="132" r="12" fill="#fa541c" stroke="#fff" stroke-width="2.5"/><text x="430" y="136.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text></g><circle cx="630" cy="160" r="14" fill="#fff" stroke="#c5ccd6"/><text x="630" y="165" font-size="13" font-weight="600" fill="#5c6978" text-anchor="middle">3</text><text x="652" y="165" font-size="13" font-weight="400" fill="#5c6978" text-anchor="start">Two-factor sign-in</text><g><circle cx="630" cy="132" r="12" fill="#fa541c" stroke="#fff" stroke-width="2.5"/><text x="630" y="136.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><rect x="250" y="200" width="460" height="360" rx="8" fill="#fff" stroke="#e3e8ee" stroke-width="1" opacity="1"/><text x="266" y="228" font-size="14" font-weight="600" fill="#17202b" text-anchor="start">Choose your own password</text><line x1="250" y1="244" x2="710" y2="244" stroke="#e3e8ee" stroke-width="1"/><text x="266" y="268" font-size="12" font-weight="400" fill="#5c6978" text-anchor="start">You're signed in with a temporary password. Replace it with your own.</text><text x="266" y="296" font-size="12" font-weight="400" fill="#5c6978" text-anchor="start">Current (temporary) password</text><rect x="266" y="302" width="428" height="32" rx="6" fill="#fff" stroke="#d0d7e0" stroke-width="1" opacity="1"/><text x="276" y="322.5" font-size="13" font-weight="400" fill="#17202b" text-anchor="start">••••••••••</text><text x="266" y="360" font-size="12" font-weight="400" fill="#5c6978" text-anchor="start">New password</text><rect x="266" y="366" width="428" height="32" rx="6" fill="#fff" stroke="#d0d7e0" stroke-width="1" opacity="1"/><text x="276" y="386.5" font-size="13" font-weight="400" fill="#17202b" text-anchor="start">••••••••••••</text><text x="266" y="414" font-size="11" font-weight="400" fill="#8a96a5" text-anchor="start">At least 8 characters, with upper and lower case letters, 